name: Deploy

# Push to main only — never on pull_request, so this never touches
# production from an unreviewed branch. Runs after ci.yml would have
# already gated the PR that landed this commit, but re-checks here too
# since this is the one workflow allowed to actually deploy.
on:
  push:
    branches: [main]

# Never let two deploys race each other onto the same Worker.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci

      # Same sentinel values as ci.yml — tests and the typecheck never
      # need real Supabase/Razorpay access, and must never accidentally
      # touch production data.
      - run: npm test
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - run: npx tsc --noEmit

      # The real build: VITE_* values get baked into the client bundle,
      # so this step alone uses the real production values.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      # wrangler deploy only uploads code — it does not touch the
      # Worker's own persisted secrets (SUPABASE_SERVICE_ROLE_KEY,
      # RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, RESEND_API_KEY,
      # EMAIL_FROM), which were already set directly on the Worker and
      # survive every deploy untouched.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler --cwd ./.output deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
